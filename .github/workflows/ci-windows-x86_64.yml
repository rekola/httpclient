name: Windows x86-64

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  # MSYS2 UCRT64 (MinGW-w64 GCC); the backend is WinHTTP.
  build-and-test:
    runs-on: windows-2022

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-utf8proc
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: cmake -G Ninja -B build

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Install and use
        run: |
          cmake --install build --prefix "$PWD/prefix"
          cmake -G Ninja -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
