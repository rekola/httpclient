name: Linux x86-64

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    # The tests make a self-signed certificate with openssl for the HTTPS cases; without it they would be skipped.
    env:
      HTTPCLIENT_REQUIRE_TLS_TEST: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libcurl4-openssl-dev libutf8proc-dev python3 openssl

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # What a project using the installed library does.
      - name: Install and use
        run: |
          cmake --install build --prefix "$PWD/prefix"
          cmake -S tests/consumer -B build-consumer -DCMAKE_PREFIX_PATH="$PWD/prefix"
          cmake --build build-consumer
          ctest --test-dir build-consumer --output-on-failure
